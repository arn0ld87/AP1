name: Update roadmap milestone 2

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  update-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Update M2 to current repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/2" \
            -f title='M2 – Trainer & Lernfluss' \
            -f description='Bis 18.09.: vorhandenen AP1-Trainer an die gemeinsame Datenbasis anbinden, prüfungsnahe Generatorlücken schließen, Tagesplan und Lernmaterial verknüpfen sowie Fortschritt portabel sichern.' \
            -f due_on='2026-09-18T00:00:00Z' >/dev/null
