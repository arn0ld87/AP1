# =============================================================================
# Traefik-Router fuer die AP1-Lernplattform -- pruefung.alexle135.de
# =============================================================================
# Gehoert auf armserver nach /opt/traefik/dynamic/pruefung.yml.
#
# ZWEI Router, mit Absicht:
#   pruefung-public  websecure   -- oeffentlich (DNS: A 89.58.35.35, proxied).
#                                   Crowdsec haengt am Entrypoint websecure.
#   pruefung         tswebsecure -- Zugang aus dem Tailnet (bleibt erhalten).
#
# Zertifikat: letsencrypt-Resolver mit DNS-Challenge (funktioniert unabhaengig
# davon, wohin der DNS-Record zeigt).
# =============================================================================

http:
  routers:
    pruefung-public:
      rule: "Host(`pruefung.alexle135.de`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "pruefung.alexle135.de"
      middlewares:
        - security-headers@file
      service: pruefung
    pruefung:
      rule: "Host(`pruefung.alexle135.de`)"
      entrypoints:
        - tswebsecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "pruefung.alexle135.de"
      middlewares:
        - security-headers@file
      service: pruefung
  services:
    pruefung:
      loadBalancer:
        servers:
          - url: "http://pruefung-frontend:3000"
