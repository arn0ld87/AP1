# =============================================================================
# Traefik-Router fuer die AP1-Lernplattform -- pruefung.alexle135.de
# =============================================================================
# Gehoert auf armserver nach /opt/traefik/dynamic/pruefung.yml.
#
# Nur `tswebsecure`, also nur ueber Tailscale -- gleiches Muster wie ap1.yml:
# pruefung.alexle135.de zeigt auf 100.71.152.44 (CGNAT/Tailscale), ein
# oeffentlicher Router waere eine Regel ohne Weg dorthin.
#
# Das Zertifikat holt Traefik ueber letsencrypt (DNS-Challenge-faehiger
# Resolver, funktioniert auch fuer Namen auf private Adressen).
# =============================================================================

http:
  routers:
    pruefung:
      rule: "Host(`pruefung.alexle135.de`)"
      entrypoints:
        - tswebsecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "pruefung.alexle135.de"
      middlewares:
        - security-headers@file
      service: pruefung
  services:
    pruefung:
      loadBalancer:
        servers:
          - url: "http://pruefung-frontend:3000"
